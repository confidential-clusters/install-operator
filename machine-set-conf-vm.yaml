apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  labels:
    machine.openshift.io/cluster-api-cluster: afrosi-test-h96rn
    machine.openshift.io/cluster-api-machine-role: worker
    machine.openshift.io/cluster-api-machine-type: worker
  name: machinset-conf-nodes
  namespace: openshift-machine-api
spec:
  replicas: 0
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: afrosi-test-h96rn
      machine.openshift.io/cluster-api-machineset: afrosi-test-h96rn-worker-germanywestcentral1
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: afrosi-test-h96rn
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
        machine.openshift.io/cluster-api-machineset: afrosi-test-h96rn-worker-germanywestcentral1
    spec:
      lifecycleHooks: {}
      metadata: {}
      providerSpec:
        value:
          # Disabled: DC-series VMs for confidential computing do not support accelerated networking
          acceleratedNetworking: false
          apiVersion: machine.openshift.io/v1beta1
          credentialsSecret:
            name: azure-cloud-credentials
            namespace: openshift-machine-api
          diagnostics: {}
          # Required for Confidential Computing: Use a custom image compatible with confidential VMs
          # Image must support AMD SEV-SNP and be configured for confidential computing
          image:
            offer: ""
            publisher: ""
            resourceID: /resourceGroups/afrosi_group/providers/Microsoft.Compute/galleries/afrosi_gallery/images/rhcos-9.6.20260309-0-azure.x86_64/versions/0.1.0
            sku: ""
            version: ""
          kind: AzureMachineProviderSpec
          location: germanywestcentral
          managedIdentity: afrosi-test-h96rn-identity
          metadata: {}
          networkResourceGroup: afrosi-test-h96rn-rg
          osDisk:
            diskSettings: {}
            diskSizeGB: 128
            managedDisk:
              securityProfile:
                diskEncryptionSet: {}
                # Required for Confidential VM: VMGuestStateOnly encrypts the VM guest state
                securityEncryptionType: VMGuestStateOnly
              storageAccountType: Premium_LRS
            osType: Linux
          publicIP: false
          publicLoadBalancer: afrosi-test-h96rn
          resourceGroup: afrosi-test-h96rn-rg
          # Required for Confidential Computing: Configure VM security profile
          securityProfile:
            settings:
              confidentialVM:
                uefiSettings:
                  # Enable Secure Boot for trusted boot chain
                  secureBoot: Enabled
                  # Enable vTPM for attestation and key protection
                  virtualizedTrustedPlatformModule: Enabled
              # Required: Set security type to ConfidentialVM
              securityType: ConfidentialVM
          subnet: afrosi-test-h96rn-worker-subnet
          # Secret containing ignition config with registration server URL
          # Created by create-machineset.sh script
          userDataSecret:
            name: conf-ignition-secret
          # Required for Confidential Computing: Use DC-series VM size (DCadsv5 or DCasv5)
          # Supports AMD SEV-SNP confidential computing technology
          vmSize: Standard_DC4ads_v5
          vnet: afrosi-test-h96rn-vnet
          zone: "1"
